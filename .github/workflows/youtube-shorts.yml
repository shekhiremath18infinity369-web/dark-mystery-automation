name: Automated YouTube Shorts Upload

on:
  schedule:
    # 5:30 PM IST (12:00 UTC) and 9:30 PM IST (16:00 UTC)
    - cron: "0 12,16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-shorts-uploader
  cancel-in-progress: false

jobs:
  upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        slot: ["1730", "2130"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check uploader credentials
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GOOGLE_DRIVE_FOLDER_IDS: ${{ secrets.GOOGLE_DRIVE_FOLDER_IDS }}
        run: |
          test -n "$YOUTUBE_TOKEN_JSON" || { echo "::error::Add YOUTUBE_TOKEN_JSON repository secret."; exit 1; }
          test -n "$GOOGLE_DRIVE_FOLDER_IDS" || { echo "::error::Add GOOGLE_DRIVE_FOLDER_IDS repository secret."; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uploader/requirements.txt

      - name: Install uploader dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r uploader/requirements.txt

      - name: Upload next eligible Short
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GOOGLE_DRIVE_FOLDER_IDS: ${{ secrets.GOOGLE_DRIVE_FOLDER_IDS }}
          UPLOADED_FOLDER_ID: "1O5hn_w-J9GdNlkFAhQMRLLpOleIXxfMU"
          SLOT: ${{ matrix.slot }}
          MAX_VIDEO_MB: "100"
          HASHTAGS: "#CarCrash #Dashcam #GTA #Viral #USA #Shorts"
        run: python uploader/upload_from_drive.py
