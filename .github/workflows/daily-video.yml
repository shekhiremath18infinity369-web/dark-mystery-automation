
name: Dark Mystery Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
        env:
         GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    timeout-minutes: 20

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          pip install -r requirements.txt- name: Download English voice run: |python -m piper.download_voices en_US-lessac-medium

      - name: Start production
        run: |
          python generator/story.py
          python generator/visuals.py
          python generator/voice.py
          python generator/editor.py

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: dark-mystery-video
          path: output/horror_short.mp4
          if-no-files-found: error
          retention-days: 3
          
