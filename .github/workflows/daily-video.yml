name: Dark Mystery Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

jobs:
  workflow-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify workflow loads
        run: |
          echo "Dark Mystery Studio workflow loaded."
          echo "Scheduled for 6:00 PM India time."
