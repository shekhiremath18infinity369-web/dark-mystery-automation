
name: Dark Mystery Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Piper voice
        run: |
          python -m piper.download_voices en_US-lessac-medium

      - name: Generate story
        run: python generator/story.py

      - name: Generate narration
        run: python generator/voice.py

      - name: Generate visuals
        run: python generator/visuals.py

      - name: Render video
        run: python generator/editor.py

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: dark-mystery-video
          path: output/horror_short.mp4
          if-no-files-found: error
          retention-days: 3
